name: Bump Version
run-name: Bump version to ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (X.Y.Z)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  bump-version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
    - name: Validate version
      run: |
        if ! [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Version must be X.Y.Z, got '$VERSION'"
          exit 1
        fi
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Setup Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24
    - name: Setup tree-sitter
      uses: ./.github/actions/setup-tree-sitter
    - name: Bump manifests
      run: tree-sitter version "$VERSION"
    - name: Update Cargo.lock
      run: cargo update -p tree-sitter-witcherscript
    - name: Update package-lock.json
      run: npm install --package-lock-only --ignore-scripts
    - name: Generate
      run: tree-sitter generate
    - name: Test
      run: tree-sitter test
    - name: Open version PR
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        branch: version/${{ inputs.version }}
        delete-branch: true
        commit-message: Version ${{ inputs.version }}
        title: Version ${{ inputs.version }}
        body: Generated by `${{ github.workflow }}` from ${{ github.sha }}.
