name: build-and-test

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: Setup Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24
    - name: Setup tree-sitter
      uses: ./.github/actions/setup-tree-sitter
    - name: Generate
      id: generate
      run: tree-sitter generate
    - name: Test
      run: tree-sitter test
    - name: Refresh lockfile
      if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
      run: npm install --package-lock-only --ignore-scripts
    - name: Check generated files are committed
      if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
      run: |
        if [ -n "$(git status --porcelain -- src package-lock.json)" ]; then
          git --no-pager diff --stat -- src package-lock.json
          echo "::error::Generated files are stale. Run 'tree-sitter generate' and commit the result."
          exit 1
        fi
