name: build-and-test

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'


jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Setup
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
    - run: npm install
    - name: Generate
      run: npm run generate
    - name: Test
      run: npm run test
    - name: Open PR if parser changed
      if: github.ref == 'refs/heads/master'
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        add-paths: |
          src/parser.c
          src/grammar.json
          src/node-types.json
        branch: ci/parser
        delete-branch: true
        commit-message: "ci: parser"
        title: "ci: parser"
        body: Generated by `${{ github.workflow }}` from ${{ github.sha }}.
